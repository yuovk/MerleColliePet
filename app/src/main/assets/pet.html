<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: flex; align-items: flex-end; justify-content: center; }
  #pet {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    position: relative;
  }
  img.svg { width: 100%; height: 100%; image-rendering: pixelated; }
  .bubble {
    position: absolute; top: 10%;
    background: rgba(255,255,255,0.95); color: #2f4dff;
    border: 1px solid #bcd6ff; border-radius: 12px;
    padding: 4px 8px; font-size: 0.62em; font-weight: bold;
    white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    opacity: 0; transition: opacity 0.3s;
    max-width: 90%;
  }
  .bubble.show { opacity: 1; }
</style>
</head>
<body>
<div id="pet">
  <div class="bubble" id="bubble"></div>
  <svg class="svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <!-- 像素小鲸鱼：正面可爱朝向，浅蓝白像素块堆叠 -->
    <g style="transform-origin: 80px 130px; animation: breathe 2.6s ease-in-out infinite;">
      <!-- 背鳍 dorsal（顶部中央） -->
      <rect x="74" y="26" width="6" height="8" fill="#9fc3e8"/>
      <rect x="70" y="32" width="8" height="6" fill="#a9c9ec"/>
      <rect x="82" y="32" width="8" height="6" fill="#a9c9ec"/>
      <!-- 身体主体（正面圆润） -->
      <rect x="58" y="42" width="44" height="8" fill="#a9c9ec"/>
      <rect x="52" y="50" width="56" height="8" fill="#8fb6e0"/>
      <rect x="48" y="58" width="64" height="8" fill="#8fb6e0"/>
      <rect x="44" y="66" width="72" height="10" fill="#4e79b8"/>
      <rect x="42" y="76" width="76" height="10" fill="#4e79b8"/>
      <rect x="42" y="86" width="76" height="10" fill="#9fc3e8"/>
      <rect x="46" y="96" width="68" height="10" fill="#a9c9ec"/>
      <rect x="54" y="106" width="52" height="8" fill="#b6d2ef"/>
      <!-- 白肚皮 belly（正面中央） -->
      <rect x="58" y="82" width="44" height="12" fill="#f2f7fd"/>
      <rect x="62" y="94" width="36" height="10" fill="#f2f7fd"/>
      <rect x="68" y="104" width="24" height="8" fill="#f2f7fd"/>
      <!-- 胸鳍 fin（左右对称） -->
      <rect x="28" y="78" width="12" height="6" fill="#e4effa"/>
      <rect x="26" y="84" width="10" height="6" fill="#e4effa"/>
      <rect x="120" y="78" width="12" height="6" fill="#e4effa"/>
      <rect x="124" y="84" width="10" height="6" fill="#e4effa"/>
      <!-- 左侧深蓝像素眼 + 眼神光 -->
      <rect x="54" y="66" width="9" height="9" fill="#2a3a5c"/>
      <rect x="56" y="67" width="3" height="3" fill="#ffffff"/>
      <!-- 右侧深蓝像素眼 + 眼神光 -->
      <rect x="97" y="66" width="9" height="9" fill="#2a3a5c"/>
      <rect x="99" y="67" width="3" height="3" fill="#ffffff"/>
      <!-- 像素微笑（中央下方） -->
      <rect x="76" y="78" width="4" height="2" fill="#6e9cd0"/>
      <rect x="80" y="80" width="4" height="2" fill="#6e9cd0"/>
      <!-- 浅蓝水点装饰（左右脸颊） -->
      <rect x="44" y="52" width="4" height="4" fill="#cfe0f5"/>
      <rect x="112" y="52" width="4" height="4" fill="#cfe0f5"/>
      <!-- 喷水 spout（头顶中央喷水孔） -->
      <g id="spout" style="opacity:0; transform-origin: 80px 30px;">
        <rect x="76" y="18" width="6" height="8" fill="#bfd6f2"/>
        <rect x="70" y="12" width="4" height="6" fill="#d4e6fa"/>
        <rect x="76" y="8" width="4" height="6" fill="#d4e6fa"/>
        <rect x="82" y="12" width="4" height="6" fill="#d4e6fa"/>
      </g>
      <g id="spout2" style="opacity:0; transform-origin: 80px 30px;">
        <rect x="72" y="14" width="5" height="8" fill="#bfd6f2"/>
        <rect x="80" y="12" width="5" height="8" fill="#d4e6fa"/>
      </g>
      <!-- 睡眠 Zzz（右侧飘出） -->
      <g id="zzz" opacity="0">
        <text x="108" y="50" font-size="10" fill="#6c9fd0" font-family="monospace">Z</text>
        <text x="116" y="60" font-size="12" fill="#6c9fd0" font-family="monospace">z</text>
      </g>
    </g>
  </svg>
  <style>
    @keyframes breathe { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.03)} }
    @keyframes spoutUp { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(-16px);opacity:0} }
  </style>
</div>
<script>
  var bubble = document.getElementById('bubble');
  var spout = document.getElementById('spout');
  var spout2 = document.getElementById('spout2');
  var zzz = document.getElementById('zzz');
  var lines = {
    tap: ['噗噜…?', '摸我干嘛啦', '泡泡别戳破', '知道啦知道了'],
    dbltap: ['/// 轻点嘛…', '害羞跑走…!', '咕噜咕噜…', '别闹了啦'],
    long: ['…ZZZ', '睡个回笼…ZZZ', '好困…', 'Zzz…别吵'],
    idle: ['在呢', '想你', '看我', '咦?', '蓝蓝的…']
  };
  var timer = null;
  function say(arr) {
    var t = arr[Math.floor(Math.random() * arr.length)];
    bubble.textContent = t;
    bubble.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function(){ bubble.classList.remove('show'); }, 2600);
    if (arr === lines.idle) zzz.setAttribute('opacity','0');
  }
  function fire() {
    spout.style.animation = 'spoutUp 1s ease-out';
    spout2.style.animation = 'spoutUp 0.8s ease-out 0.2s';
    spout.style.opacity = '1'; spout2.style.opacity = '1';
    setTimeout(function(){ spout.style.opacity='0'; spout2.style.opacity='0'; }, 1500);
  }
  window.petEngine = {
    onTap: function(){ say(lines.tap); },
    onDoubleTap: function(){ say(lines.dbltap); fire(); },
    onLongPress: function(){ say(lines.long); zzz.setAttribute('opacity','1'); },
    onIdle: function(){ say(lines.idle); }
  };
  setInterval(function(){ if(Math.random()<0.3) window.petEngine.onIdle(); }, 12000);
</script>
</body>
</html>
