<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: flex; align-items: flex-end; justify-content: center; }
  #pet {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    position: relative;
  }
  img.svg { width: 100%; height: 100%; image-rendering: pixelated; }
  .bubble {
    position: absolute; top: 10%;
    background: rgba(255,255,255,0.95); color: #2f4dff;
    border: 1px solid #bcd6ff; border-radius: 12px;
    padding: 4px 8px; font-size: 0.62em; font-weight: bold;
    white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    opacity: 0; transition: opacity 0.3s;
    max-width: 90%;
  }
  .bubble.show { opacity: 1; }
</style>
</head>
<body>
<div id="pet">
  <div class="bubble" id="bubble"></div>
  <svg class="svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <!-- 像素小鲸鱼：浅蓝白像素块堆叠 -->
    <g style="transform-origin: 80px 130px; animation: breathe 2.6s ease-in-out infinite;">
      <!-- 背鳍 dorsal -->
      <rect x="60" y="34" width="6" height="8" fill="#9fc3e8"/>
      <rect x="56" y="38" width="8" height="6" fill="#a9c9ec"/>
      <!-- 尾鳍 tail（带摇尾动画） -->
      <g id="tail" style="transform-origin: 128px 92px; animation: wag 1.1s ease-in-out infinite;">
        <rect x="124" y="92" width="14" height="6" fill="#b6d2ef"/>
        <rect x="132" y="86" width="6" height="6" fill="#9fc3e8"/>
        <rect x="132" y="98" width="6" height="6" fill="#9fc3e8"/>
      </g>
      <!-- 身体主体：流线型浅蓝像素块 -->
      <rect x="52" y="46" width="16" height="8" fill="#a9c9ec"/>
      <rect x="44" y="54" width="22" height="8" fill="#8fb6e0"/>
      <rect x="38" y="62" width="28" height="8" fill="#8fb6e0"/>
      <rect x="34" y="70" width="34" height="10" fill="#4e79b8"/>
      <rect x="32" y="80" width="40" height="10" fill="#4e79b8"/>
      <rect x="34" y="90" width="42" height="10" fill="#9fc3e8"/>
      <rect x="40" y="100" width="40" height="8" fill="#a9c9ec"/>
      <!-- 白肚皮 belly -->
      <rect x="50" y="90" width="26" height="12" fill="#f2f7fd"/>
      <rect x="56" y="100" width="14" height="8" fill="#f2f7fd"/>
      <!-- 胸鳍 fin -->
      <rect x="96" y="84" width="14" height="6" fill="#e4effa"/>
      <rect x="104" y="90" width="8" height="6" fill="#e4effa"/>
      <!-- 深蓝像素眼 + 眼神光 -->
      <rect x="62" y="68" width="8" height="8" fill="#2a3a5c"/>
      <rect x="64" y="69" width="3" height="3" fill="#ffffff"/>
      <!-- 像素微笑 -->
      <rect x="68" y="78" width="4" height="2" fill="#6e9cd0"/>
      <rect x="72" y="80" width="4" height="2" fill="#6e9cd0"/>
      <!-- 浅蓝水点装饰 -->
      <rect x="42" y="52" width="4" height="4" fill="#cfe0f5"/>
      <rect x="108" y="60" width="4" height="4" fill="#cfe0f5"/>
      <!-- 喷水 spout -->
      <g id="spout" style="opacity:0;">
        <rect x="76" y="26" width="6" height="8" fill="#bfd6f2"/>
        <rect x="70" y="20" width="4" height="6" fill="#d4e6fa"/>
        <rect x="76" y="18" width="4" height="6" fill="#d4e6fa"/>
        <rect x="82" y="20" width="4" height="6" fill="#d4e6fa"/>
      </g>
      <g id="spout2" style="opacity:0;">
        <rect x="72" y="24" width="5" height="8" fill="#bfd6f2"/>
        <rect x="80" y="22" width="5" height="8" fill="#d4e6fa"/>
      </g>
      <!-- 睡眠 Zzz -->
      <g id="zzz" opacity="0">
        <text x="96" y="52" font-size="10" fill="#6c9fd0" font-family="monospace">Z</text>
        <text x="104" y="62" font-size="12" fill="#6c9fd0" font-family="monospace">z</text>
      </g>
    </g>
  </svg>
  <style>
    @keyframes breathe { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.03)} }
    @keyframes wag { 0%,100%{transform:rotate(0)} 50%{transform:rotate(10deg)} }
    @keyframes spoutUp { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(-10px);opacity:0} }
  </style>
</div>
<script>
  var bubble = document.getElementById('bubble');
  var spout = document.getElementById('spout');
  var spout2 = document.getElementById('spout2');
  var zzz = document.getElementById('zzz');
  var lines = {
    tap: ['噗噜…?', '摸我干嘛啦', '泡泡别戳破', '知道啦知道了'],
    dbltap: ['/// 轻点嘛…', '害羞跑走…!', '咕噜咕噜…', '别闹了啦'],
    long: ['…ZZZ', '睡个回笼…ZZZ', '好困…', 'Zzz…别吵'],
    idle: ['在呢', '想你', '看我', '咦?', '蓝蓝的…']
  };
  var timer = null;
  function say(arr) {
    var t = arr[Math.floor(Math.random() * arr.length)];
    bubble.textContent = t;
    bubble.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function(){ bubble.classList.remove('show'); }, 2600);
    if (arr === lines.idle) zzz.setAttribute('opacity','0');
  }
  function fire() {
    spout.style.animation = 'spoutUp 1s ease-out';
    spout2.style.animation = 'spoutUp 0.8s ease-out 0.2s';
    spout.style.opacity = '1'; spout2.style.opacity = '1';
    setTimeout(function(){ spout.style.opacity='0'; spout2.style.opacity='0'; }, 1500);
  }
  window.petEngine = {
    onTap: function(){ say(lines.tap); },
    onDoubleTap: function(){ say(lines.dbltap); fire(); },
    onLongPress: function(){ say(lines.long); zzz.setAttribute('opacity','1'); },
    onIdle: function(){ say(lines.idle); }
  };
  setInterval(function(){ if(Math.random()<0.3) window.petEngine.onIdle(); }, 12000);
</script>
</body>
</html>
